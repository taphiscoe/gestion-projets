<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <title>Modifier Sous-activité</title>
</head>

<body>
    <div layout:fragment="contenu">

        <h2 class="page-title">Modifier la sous-activité</h2>

        <div class="card card-masae p-4" style="max-width: 800px;">
            <form th:action="@{/projets/{pid}/activites/{aid}/sousactivites/{id}/modifier(pid=${projetId}, aid=${activiteId}, id=${sousActivite.id})}"
                  method="post">

                <div class="mb-3">
                    <label class="label-masae">Intitulé :</label>
                    <input type="text" name="intitule" class="form-control"
                           th:value="${sousActivite.intitule}" required>
                </div>

                <div class="mb-3">
                    <label class="label-masae">Description :</label>
                    <textarea name="description" class="form-control" rows="3"
                              th:text="${sousActivite.description}"></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="label-masae">Date début prévue :</label>
                        <input type="date" name="dateDebutPrevue" class="form-control"
                               th:value="${sousActivite.dateDebutPrevue}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="label-masae">Date fin prévue :</label>
                        <input type="date" name="dateFinPrevue" class="form-control"
                               th:value="${sousActivite.dateFinPrevue}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="label-masae">Date début réelle :</label>
                        <input type="date" name="dateDebutReelle" class="form-control"
