<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Sous-activités</title>
</head>

<body>
    <div layout:fragment="contenu">

        <h2 class="page-title">
            Sous-activités de : <span th:text="${activite.intitule}"></span>
        </h2>

        <p class="text-muted">
            Projet : <strong th:text="${activite.projet.nom}"></strong>
        </p>

        <div class="mb-3">
            <a th:href="@{/projets/{pid}/activites/{aid}/sousactivites/nouveau(pid=${projetId}, aid=${activite.id})}"
                class="btn btn-masae">+ Ajouter une sous-activité</a>
            <a th:href="@{/projets/{pid}/activites/{aid}(pid=${projetId}, aid=${activite.id})}"
                class="btn btn-outline-secondary ms-2">← Retour à l'activité</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Intitulé</th>
                        <th>Date début prévue</th>
                        <th>Date fin prévue</th>
                        <th>Montant prévu</th>
                        <th>Montant utilisé</th>
                        <th>Taux</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sa : ${sousActivites}">
                        <td th:text="${sa.intitule}"></td>
                        <td th:text="${sa.dateDebutPrevue}"></td>
                        <td th:text="${sa.dateFinPrevue}"></td>
                        <td
                            th:text="${sa.montantPrevu != null ? #numbers.formatDecimal(sa.montantPrevu, 0, 'COMMA', 0, 'POINT') + ' FCFA' : '-'}">
                        </td>
                        <td
                            th:text="${sa.montantUtilise != null ? #numbers.formatDecimal(sa.montantUtilise, 0, 'COMMA', 0, 'POINT') + ' FCFA' : '-'}">
                        </td>
                        <td th:text="${sa.tauxRealisation != null ? sa.tauxRealisation + '%' : '0%'}"></td>
                        <td>
                            <span th:text="${sa.statut}"
                                th:classappend="${sa.statut == 'En cours'} ? 'badge bg-success' :
                                                  (${sa.statut == 'Planifiée'} ? 'badge bg-primary' :
                                                  (${sa.statut == 'Terminée'} ? 'badge bg-secondary' : 'badge bg-danger'))">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/projets/{pid}/activites/{aid}/sousactivites/{id}(pid=${projetId}, aid=${activite.id}, id=${sa.id})}"
                                class="btn btn-sm btn-outline-success">👁️ Voir</a>
                            <a th:href="@{/projets/{pid}/activites/{aid}/sousactivites/{id}/modifier(pid=${projetId}, aid=${activite.id}, id=${sa.id})}"
                                class="btn btn-sm btn-outline-primary">✏️</a>
                            <a th:href="@{/projets/{pid}/activites/{aid}/sousactivites/{id}/supprimer(pid=${projetId}, aid=${activite.id}, id=${sa.id})}"
                                class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Supprimer cette sous-activité ?')">🗑️</a>
                        </td>
                    </tr>
                    <tr th:if="${sousActivites.empty}">
                        <td colspan="8" class="text-center text-muted">
                            Aucune sous-activité pour cette activité
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>

</html>
