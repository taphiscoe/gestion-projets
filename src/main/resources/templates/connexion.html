<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - MASAE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f7f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .drapeau-bar {
            height: 5px;
            background: linear-gradient(to right,
                #00853F 33%,
                #FDEF42 33%,
                #FDEF42 66%,
                #E31B23 66%);
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            border-top: 4px solid #1a5c38;
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #1a5c38;
            letter-spacing: 3px;
        }

        .logo-subtitle {
            font-size: 0.7rem;
            color: #666;
            display: block;
            margin-bottom: 1.5rem;
        }

        .btn-masae {
            background-color: #1a5c38;
            color: white;
            border: none;
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
        }

        .btn-masae:hover {
            background-color: #144d2e;
            color: white;
        }

        .footer-masae {
            background-color: #1a5c38;
            color: #a8d5b5;
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Barre drapeau -->
    <div class="drapeau-bar"></div>

    <div class="login-container">
        <div class="login-card">

            <div class="text-center mb-4">
                <div class="logo-text">MASAE</div>
                <span class="logo-subtitle">
                    Ministère de l'Agriculture, de la Souveraineté<br>
                    Alimentaire et de l'Élevage
                </span>
                <hr>
                <p class="text-muted small">Plateforme de Gestion des Projets</p>
            </div>

            <!-- Message d'erreur -->
            <div th:if="${param.erreur}" class="alert alert-danger text-center">
                Email ou mot de passe incorrect !
            </div>

            <!-- Message déconnexion -->
            <div th:if="${param.deconnecte}" class="alert alert-success text-center">
                Vous avez été déconnecté avec succès.
            </div>

            <form th:action="@{/connexion}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Email :</label>
                    <input type="email" name="username" class="form-control"
                           placeholder="votre@email.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Mot de passe :</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-masae">
                    🔐 Se connecter
                </button>

            </form>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer-masae">
        © 2026 MASAE — République du Sénégal
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
