<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <title>Nouvel Utilisateur</title>
</head>

<body>
    <div layout:fragment="contenu">

        <h2 class="page-title">👤 Nouvel Utilisateur</h2>

        <div class="card card-masae p-4" style="max-width: 600px;">
            <form action="/admin/utilisateurs" method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="label-masae">Prénom :</label>
                        <input type="text" name="prenom" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="label-masae">Nom :</label>
                        <input type="text" name="nom" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="label-masae">Email :</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="label-masae">Mot de passe :</label>
                    <input type="password" name="motDePasse" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="label-masae">Rôle :</label>
                    <select name="role" class="form-select" required>
                        <option value="">--Sélectionnez un rôle--</option>
                        <option value="ADMIN">Administrateur</option>
                        <option value="AGENT">Agent de saisie</option>
                        <option value="FINANCIER">Responsable Financier</option>
                        <option value="AUTORITE">Autorité</option>
                        <option value="PARTENAIRE">Partenaire</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="label-masae">Région de rattachement :</label>
                    <select name="region" class="form-select">
                        <option value="">--Toutes les régions--</option>
                        <option value="Dakar">Dakar</option>
                        <option value="Thiès">Thiès</option>
                        <option value="Diourbel">Diourbel</option>
                        <option value="Saint-Louis">Saint-Louis</option>
                        <option value="Louga">Louga</option>
                        <option value="Fatick">Fatick</option>
                        <option value="Kaolack">Kaolack</option>
                        <option value="Kaffrine">Kaffrine</option>
                        <option value="Tambacounda">Tambacounda</option>
                        <option value="Kédougou">Kédougou</option>
                        <option value="Kolda">Kolda</option>
                        <option value="Ziguinchor">Ziguinchor</option>
                        <option value="Sédhiou">Sédhiou</option>
                        <option value="Matam">Matam</option>
                    </select>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-masae">💾 Sauvegarder</button>
                    <a href="/admin/utilisateurs" class="btn btn-outline-secondary ms-2">Annuler</a>
                </div>

            </form>
        </div>

    </div>
</body>
</html>
